name: Release

# Pushing a tag such as v0.12.0 runs the tests, builds the installer and publishes a GitHub release with
# the installer and latest.json. Running it by hand (Actions tab) builds the installer and keeps it as a download.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-build.txt

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python -c "from weatherlab.config import APP_VERSION; print(APP_VERSION)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match APP_VERSION $version in weatherlab/config.py"
            exit 1
          fi

      - name: Run the tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build the exe
        run: python build_exe.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Find the Inno Setup compiler
        shell: pwsh
        run: |
          $folder = Get-ChildItem -Path "C:\Program Files (x86)", "C:\Program Files" -Directory -Filter "Inno Setup*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $folder) { Write-Error "No Inno Setup folder found"; exit 1 }
          $iscc = Join-Path $folder.FullName "ISCC.exe"
          if (-not (Test-Path $iscc)) { Write-Error "ISCC.exe not found in $($folder.FullName)"; exit 1 }
          Write-Host "Using $iscc"
          Add-Content -Path $env:GITHUB_ENV -Value "ISCC=$iscc"

      - name: Build the installer
        run: python build_installer.py

      - name: Keep the installer for a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: WeatherLab-installer
          path: installer/

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installer/WeatherLabSetup-*.exe installer/latest.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" installer/WeatherLabSetup-*.exe installer/latest.json \
              --title "Weather Lab $GITHUB_REF_NAME" --generate-notes
          fi
