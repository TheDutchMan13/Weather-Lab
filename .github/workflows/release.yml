name: Release

# Pushing a tag such as v0.12.0 runs the tests, builds the installer and publishes a GitHub release with
# the installer and latest.json. Running it by hand (Actions tab) builds the installer and keeps it as a download.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-build.txt

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python -c "from weatherlab.config import APP_VERSION; print(APP_VERSION)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match APP_VERSION $version in weatherlab/config.py"
            exit 1
          fi

      - name: Run the tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build the exe
        run: python build_exe.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build the installer
        run: python build_installer.py

      - name: Keep the installer for a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: WeatherLab-installer
          path: installer/

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" installer/WeatherLabSetup-*.exe installer/latest.json \
            --title "Weather Lab $GITHUB_REF_NAME" --generate-notes
