name: Release

# Every push to main checks the version in weatherlab/config.py. When that version has no GitHub release yet,
# the workflow runs the tests, builds the installer, and publishes a release (tag vX.Y.Z on that commit) with the
# installer and latest.json. Pushes that don't change the released version do nothing.
#
# Pushing a tag such as v0.13.0 by hand does the same build and publishes to that tag.
# Running it by hand (Actions tab) builds the installer and keeps it as a download without publishing.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      publish: ${{ steps.decide.outputs.publish }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Decide whether to build and publish
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' weatherlab/config.py)
          if [ -z "$version" ]; then echo "APP_VERSION not found in weatherlab/config.py"; exit 1; fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$tag has no release yet; building and publishing it."
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-build.txt

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python -c "from weatherlab.config import APP_VERSION; print(APP_VERSION)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match APP_VERSION $version in weatherlab/config.py"
            exit 1
          fi

      - name: Run the tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build the exe
        run: python build_exe.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Find the Inno Setup compiler
        shell: pwsh
        run: |
          $folder = Get-ChildItem -Path "C:\Program Files (x86)", "C:\Program Files" -Directory -Filter "Inno Setup*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $folder) { Write-Error "No Inno Setup folder found"; exit 1 }
          $iscc = Join-Path $folder.FullName "ISCC.exe"
          if (-not (Test-Path $iscc)) { Write-Error "ISCC.exe not found in $($folder.FullName)"; exit 1 }
          Write-Host "Using $iscc"
          Add-Content -Path $env:GITHUB_ENV -Value "ISCC=$iscc"

      - name: Build the installer
        run: python build_installer.py

      - name: Keep the installer for a manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: WeatherLab-installer
          path: installer/

      - name: Publish the release
        if: needs.check.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" installer/WeatherLabSetup-*.exe installer/latest.json --clobber
          else
            gh release create "$TAG" installer/WeatherLabSetup-*.exe installer/latest.json \
              --target "$GITHUB_SHA" --title "Weather Lab $TAG" --generate-notes
          fi
