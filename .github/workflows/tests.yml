name: Tests

# Runs the tests on every push to main and on every pull request, with Streamlit installed, so the page tests that are
# skipped on a machine without Streamlit actually run here. The Release workflow runs the tests again before building.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the app's requirements
        run: pip install -r requirements.txt
      - name: Run the tests
        run: python -m unittest discover -s tests -p "test_*.py"
      # Starts the whole app headlessly. New and not yet proven on GitHub, so it reports its own result without
      # failing the run; remove continue-on-error once it has passed.
      - name: Start-up check
        continue-on-error: true
        env:
          WEATHERLAB_APP_SMOKE: "1"
        run: python -m unittest tests.test_app_smoke -v
